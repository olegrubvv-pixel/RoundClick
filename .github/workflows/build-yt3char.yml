name: Build YT3CharDirect APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'YT3CharDirect/**'
      - '.github/workflows/build-yt3char.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: YT3CharDirect
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: YT3CharDirect-debug-apk
          path: YT3CharDirect/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
